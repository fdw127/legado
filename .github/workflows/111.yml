name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version (e.g., 3.24.0810)
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 构建所有需要的变体（例如 appRelease 和 appLegacyRelease 等）
      - name: Build release variants
        run: |
          ./gradlew assembleRelease          # 默认变体
          # 如果有其他变体，例如 appLegacy，加上：
          # ./gradlew assembleAppLegacyRelease

      # 重命名 APK 并统一放入一个目录（避免第一套中的目录删除问题）
      - name: Rename APKs
        run: |
          mkdir -p dist
          # 查找所有生成的 release APK（多路径）
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            # 按照第一套的重命名规则（关键字替换）
            # 假设变体名称中含有 "新包名" 或 "新共存"，但实际可能是变体名
            # 这里可以根据实际变体名称替换，例如将 "app" 替换为 "release"，"appLegacy" 替换为 "releaseA"
            # 为了模拟第一套，我们可以根据路径或文件名中的关键字替换
            if [[ "$filename" == *"app"* ]]; then
              newname="${filename/app/release}"
            elif [[ "$filename" == *"appLegacy"* ]]; then
              newname="${filename/appLegacy/releaseA}"
            else
              newname="$filename"
            fi
            # 保留原始版本号，但可以追加版本标签
            mv "$apk" "dist/${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
          done

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
