name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 定义两种构建变体，对应官方的“新包名”与“新共存”
        type: [release, releaseA]
        # 根据官方逻辑，type 为 release 时 product 对应“新包名”，type 为 releaseA 时对应“新共存”
        include:
          - type: release
            product: 新包名
          - type: releaseA
            product: 新共存

    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 生成版本号（格式：3.年.月日时）
      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 签名配置（官方方案） ----------
      - name: Setup APK Signing
        run: |
          # 1. 解码密钥库文件（需在 Secrets 中配置 RELEASE_KEY_STORE）
          echo "${{ secrets.RELEASE_KEY_STORE }}" | base64 --decode > $GITHUB_WORKSPACE/app/legado.jks
          # 2. 将签名信息写入 gradle.properties（Gradle 构建时会自动读取）
          {
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_STORE_FILE=./legado.jks"
            echo "RELEASE_KEY_ALIAS=legado"
          } >> $GITHUB_WORKSPACE/gradle.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------- 构建对应变体的 APK ----------
      # 使用 -Pproduct 参数传递变体标识（需 build.gradle 支持该参数），
      # 若项目已定义 flavor “新包名”和“新共存”，也可直接使用 assemble新包名Release 等，
      # 但官方采用动态参数方式，兼容性更好。
      - name: Build release APK (${{ matrix.type }})
        run: |
          ./gradlew :app:assembleRelease -Pproduct=${{ matrix.product }}

      # ---------- 重命名 APK ----------
      - name: Rename APK (${{ matrix.type }})
        run: |
          # 将生成的 APK 移至根目录并重命名（完全遵循官方 BetaRelease.yml 规则）
          mv app/build/outputs/apk/*/release/*.apk .
          # 删除空子目录（可选）
          rm -rf app/build/outputs/apk/*/release
          for file in *.apk; do
            if [[ "$file" = *新包名* ]]; then
              newname="${file/新包名/release}"
            else
              newname="${file/新共存/releaseA}"
            fi
            # 追加版本号后缀
            mv -- "$file" "${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
          done

      # ---------- 上传 APK 作为 Artifact ----------
      - name: Upload APK (${{ matrix.type }})
        uses: actions/upload-artifact@v4
        with:
          name: legado_app_${{ matrix.type }}_${{ steps.set-ver.outputs.version }}
          path: |
            *.apk
