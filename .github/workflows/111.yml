name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 生成版本号（例如 3.24.0810）
      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------- 签名配置（可选，如已配置可忽略） ----------
      # 如果您的签名密钥存储在 GitHub Secrets 中，请取消注释以下步骤
      # - name: Decode keystore
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      # ---------- 构建所有需要的风味 ----------
      # 明确构建两个风味的 Release 变体
      - name: Build release APKs
        run: |
          ./gradlew assemble新包名Release assemble新共存Release
          # 如果风味名称是英文，请替换为实际名称，例如：
          # ./gradlew assembleAppRelease assembleAppLegacyRelease

      # ---------- 重命名 APK（完全按照第一套逻辑） ----------
      - name: Rename APKs
        run: |
          mkdir -p dist
          # 查找所有生成的 APK（可能分布在不同的架构子目录中）
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            # 按照您的原规则：包含"新包名" → 替换为"release"
            # 否则（即包含"新共存"）→ 替换为"releaseA"
            if [[ "$filename" == *新包名* ]]; then
              newname="${filename/新包名/release}"
            else
              newname="${filename/新共存/releaseA}"
            fi
            # 追加版本号后缀，保持原扩展名
            mv "$apk" "dist/${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
          done

      # ---------- 上传 APK 作为 Artifact ----------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
