name: Build APK Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: set-ver
        run: echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleappLegacyRelease   # 直接指定变体

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: appLegacy-${{ steps.set-ver.outputs.version }}
          path: app/build/outputs/apk/*/release/*.apk
