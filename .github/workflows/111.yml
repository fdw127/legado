name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify keystore
        run: |
          if [ ! -f "legado.jks" ]; then
            echo "❌ legado.jks not found in root directory"
            exit 1
          fi
          echo "✅ legado.jks found"
          if keytool -list -keystore legado.jks -storepass legado -alias legado > /dev/null 2>&1; then
            echo "✅ Keystore can be read with password 'legado'"
          else
            echo "❌ Failed to read keystore with password 'legado'"
            echo "Please set correct passwords via Secrets or modify the script."
            exit 1
          fi

      - name: Setup APK Signing
        run: |
          {
            echo "RELEASE_KEY_ALIAS=legado"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD:-legado}"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD:-legado}"
            echo "RELEASE_STORE_FILE=./legado.jks"
          } >> gradle.properties
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Build release APKs
        run: |
          ./gradlew assembleAppRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/app/release -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" =~ ^app-(.+)-release\.apk$ ]]; then
              arch="${BASH_REMATCH[1]}"
              newname="release_${arch}_${{ steps.set-ver.outputs.version }}.apk"
            elif [[ "$filename" == "app-release.apk" ]]; then
              newname="release_universal_${{ steps.set-ver.outputs.version }}.apk"
            else
              newname="${filename/app/release}"
              newname="${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
            fi
            mv "$apk" "dist/$newname"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
