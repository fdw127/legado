name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 生成版本号（格式：3.年.月日时）
      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------- 签名密钥解码（如果您的密钥存储在 Secrets 中） ----------
      # 如果您还没有配置签名，请先完成 Gradle 签名配置，并将密钥文件 Base64 存入 GitHub Secrets
      # - name: Decode keystore
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
      # 并在 app/build.gradle 中引用该文件及密码（通过环境变量）

      # ---------- 构建 app 风味的所有 Release APK ----------
      - name: Build release APKs
        run: |
          ./gradlew assembleAppRelease

      # ---------- 重命名 APK ----------
      # 假设 APK 位于 app/build/outputs/apk/app/release/ 下
      # 文件名格式通常为 app-<架构>-release.apk 或 app-release.apk（通用）
      - name: Rename APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/app/release -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            # 去掉开头的 "app-" 和结尾的 "-release"（如果有）
            # 例如 app-arm64-v8a-release.apk → arm64-v8a
            # 或者 app-release.apk → （无架构）
            if [[ "$filename" =~ ^app-(.+)-release\.apk$ ]]; then
              arch="${BASH_REMATCH[1]}"
              newname="release_${arch}_${{ steps.set-ver.outputs.version }}.apk"
            elif [[ "$filename" == "app-release.apk" ]]; then
              # 通用包（可能包含所有架构）
              newname="release_universal_${{ steps.set-ver.outputs.version }}.apk"
            else
              # 保底：直接替换 app 为 release
              newname="${filename/app/release}"
              newname="${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
            fi
            mv "$apk" "dist/$newname"
          done

      # ---------- 上传 APK ----------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
