name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 生成版本号（格式：3.年.月日时）
      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------- 签名配置（直接使用仓库根目录的 legado.jks） ----------
      - name: Setup APK Signing
        run: |
          # 将签名配置写入 gradle.properties，Gradle 构建时会自动读取
          {
            echo "RELEASE_KEY_ALIAS=legado"
            echo "RELEASE_KEY_PASSWORD=legado"
            echo "RELEASE_STORE_PASSWORD=legado"
            echo "RELEASE_STORE_FILE=../legado.jks"
          } >> gradle.properties

      # ---------- 构建 app 风味的所有 Release APK ----------
      - name: Build release APKs
        run: |
          ./gradlew assembleAppRelease

      # ---------- 重命名 APK ----------
      - name: Rename APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/app/release -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            if [[ "$filename" =~ ^app-(.+)-release\.apk$ ]]; then
              arch="${BASH_REMATCH[1]}"
              newname="release_${arch}_${{ steps.set-ver.outputs.version }}.apk"
            elif [[ "$filename" == "app-release.apk" ]]; then
              newname="release_universal_${{ steps.set-ver.outputs.version }}.apk"
            else
              newname="${filename/app/release}"
              newname="${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
            fi
            mv "$apk" "dist/$newname"
          done

      # ---------- 上传 APK ----------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
