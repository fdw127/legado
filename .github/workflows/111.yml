name: Build APKs Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version (based on date)
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 构建所有需要的变体（示例中构建 app 和 appLegacy 两种 product flavor）
      # 如果只有一种，请调整为 ./gradlew assembleRelease
      - name: Build release APKs
        run: |
          ./gradlew assembleAppRelease assembleAppLegacyRelease

      # 重命名 APK（模拟代码一中的逻辑）
      - name: Rename APKs
        run: |
          mkdir -p apk_output
          # 查找所有构建出的 APK（按变体目录）
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            # 根据文件名中的关键字替换（与代码一一致）
            if [[ "$filename" == *"新包名"* ]]; then
              newname="${filename/新包名/release}"
            else
              newname="${filename/新共存/releaseA}"
            fi
            # 复制到统一输出目录，同时可添加版本后缀（可选）
            cp "$apk" "apk_output/${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
          done

      # 上传所有重命名后的 APK 作为 Artifact
      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado_apks_${{ steps.set-ver.outputs.version }}
          path: apk_output/*.apk
