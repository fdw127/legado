name: Build Signed APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---------- 签名配置（如需） ----------
      # 如果您的签名密钥存储在 GitHub Secrets 中，取消注释以下步骤
      # - name: Decode keystore
      #   env:
      #     KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      #   run: |
      #     echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
      # 并确保在 app/build.gradle 中引用该密钥文件及密码（通过环境变量）

      # ---------- 构建所有需要的变体 ----------
      # 根据报错，至少存在 app，也可能有 appLegacy（请根据实际情况增减）
      - name: Build release APKs
        run: |
          ./gradlew assembleAppRelease assembleAppLegacyRelease
          # 如果只有一个变体，则只用 ./gradlew assembleAppRelease

      # ---------- 重命名 APK ----------
      - name: Rename APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -type f | while read -r apk; do
            filename=$(basename "$apk")
            # 根据实际 flavor 名称替换
            if [[ "$filename" == *"app"* ]]; then
              newname="${filename/app/release}"
            elif [[ "$filename" == *"appLegacy"* ]]; then
              newname="${filename/appLegacy/releaseA}"
            else
              newname="$filename"   # 保底，不重命名
            fi
            # 追加版本号后缀
            mv "$apk" "dist/${newname%.apk}_${{ steps.set-ver.outputs.version }}.apk"
          done

      # ---------- 上传 APK ----------
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: legado_apps_${{ steps.set-ver.outputs.version }}
          path: dist/*.apk
